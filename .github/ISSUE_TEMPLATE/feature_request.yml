name: Feature request
description: Suggest an improvement, a helper, or a missing endpoint.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please check the
        [documentation](https://andrevarandas.github.io/clash-royale-api-py/)
        first — the feature may already exist.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the use case, not just the solution.
      placeholder: "I want to ... but currently ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would the ideal API look like?
      render: python
      placeholder: |
        for member in api.clans.members("2PP").iter_all():
            print(member.name)

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or the `api.raw` escape hatch.

  - type: input
    id: endpoint
    attributes:
      label: Related API endpoint
      description: If this is about a missing endpoint, link the official docs.
      placeholder: "https://developer.clashroyale.com/#/documentation"

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I searched the existing issues and did not find a duplicate.
          required: true
