[project]
name = "clash-royale-api-py"
version = "0.1.1"
description = "An unofficial Python wrapper for the official Clash Royale API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "André", email = "andre.m.varandas@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]
keywords = ["clash-royale", "supercell", "api", "api-wrapper", "gaming"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Games/Entertainment",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/AndreVarandas/clash-royale-api-py"
Repository = "https://github.com/AndreVarandas/clash-royale-api-py"
Documentation = "https://andrevarandas.github.io/clash-royale-api-py/"
Changelog = "https://github.com/AndreVarandas/clash-royale-api-py/blob/main/CHANGELOG.md"
Issues = "https://github.com/AndreVarandas/clash-royale-api-py/issues"
Security = "https://github.com/AndreVarandas/clash-royale-api-py/security/policy"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "respx>=0.22.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
    "pytest-cov>=7.1.0",
    "pre-commit>=4.6.2",
]
docs = [
    "mkdocs-material>=9.5.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Never let local tool caches or built docs leak into a release artifact.
source-exclude = ["**/.mypy_cache", "**/.pytest_cache", "**/.ruff_cache", "/site"]
wheel-exclude = ["**/.mypy_cache", "**/.pytest_cache", "**/.ruff_cache"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["clash_royale_api_py"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
